name: Fabric CI/CD Automated Deploy

on:
  workflow_dispatch: # Dispara o deploy apenas quando você apertar o botão

jobs:
  deploy-and-bind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Setup do Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Bibliotecas
        run: pip install requests azure-identity 

      - name: Executar Orquestrador do Fabric
        env:
          TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          DEV_WORKSPACE_ID: 'coloque-o-guid-do-workspace-dev'
          PROD_WORKSPACE_ID: 'coloque-o-guid-do-workspace-prod'
          PIPELINE_ID: 'coloque-o-guid-do-deployment-pipeline'
        
        run: python scripts/deploy_orchestrator.py
